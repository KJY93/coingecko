services:
  redis:
    image: redis:8.8
    container_name: gecko-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    logging: &logcap
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: gecko-rabbitmq
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    logging: *logcap

  app:
    build: .
    container_name: gecko-api
    restart: unless-stopped
    env_file: .env
    environment:
      APP_REDIS_URL: redis://redis:6379
      APP_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - redis
      - rabbitmq
    logging: *logcap

  consumer:
    build: .
    container_name: gecko-consumer
    restart: unless-stopped
    command: python -m app.consumer
    env_file: .env
    environment:
      APP_REDIS_URL: redis://redis:6379
      APP_RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq
    logging: *logcap

  nginx:
    image: nginx:1.27-alpine
    container_name: gecko-nginx
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    logging: *logcap

volumes:
  redis-data:
  rabbitmq-data: